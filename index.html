<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EyeHealth</title>

    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }
        header {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hero {
            text-align: center;
            max-width: 700px;
            padding: 20px;
        }
        .hero h1 {
            color: #1ADEDE;
            font-size: 64px;
            font-weight: 300;
        }
        .hero p {
            color: #bdbdbd;
            font-size: 18px;
        }
        .button {
            display: inline-block;
            margin-top: 24px;
            font-weight: 600;
            background-color: #1ADEDE;
            color: black;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 999px;
            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }
        .button:hover {
            opacity: 0.8;
            transform: translateY(-2px)
        }
        .container {
            width: 90%;
            max-width: 900px;
            margin: 0 auto;
        }
        .section {
            padding: 80px 0;
        }
        .about {
            text-align: center;
        }
    </style>
</head>
    
<body>
    <header>
        <div class="hero">
            <h1>EyeHealth</h1>
            <p>Take care of your eyes during screen use.</p>
            
            <a class="button" href="#privacy">
                Privacy policy
            </a>
        </div>
    </header>

    <main>
        <section class="about">
            <div class="container">
               <h2>About EyeHealth</h2>
                <p>
                    EyeHealth helps you take regular breaks during prolonged
                    screen use by making the 20-20-20 rule easier to follow.
                </p> 
            </div>
        </section>
        
        <section id="privacy">
            <h2>Privacy Policy</h2>
            <p>Privacy policy content will be added here.</p>
        </section>
    </main>
    
</body>
</html>
